
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Drum Kit Engine</title>
</head>

<body>
    <header>
        <h1>Drum Kit Engine</h1>
        <p>
            Play drum sounds using your keyboard
            or the drum pads.
        </p>
    </header>

    <main id="main-content">
        <section aria-labelledby="drum-title">
            <h2 id="drum-title">Drum Pads</h2>

            <div class="drum-kit">

                <button
                    type="button"
                    class="drum-pad"
                    data-sound="kick"
                    data-key="a"
                >
                    <kbd>A</kbd>
                    <span>Kick</span>
                </button>

                <button
                    type="button"
                    class="drum-pad"
                    data-sound="snare"
                    data-key="s"
                >
                    <kbd>S</kbd>
                    <span>Snare</span>
                </button>

                <button
                    type="button"
                    class="drum-pad"
                    data-sound="hihat"
                    data-key="d"
                >
                    <kbd>D</kbd>
                    <span>Hi-Hat</span>
                </button>

                <button
                    type="button"
                    class="drum-pad"
                    data-sound="clap"
                    data-key="f"
                >
                    <kbd>F</kbd>
                    <span>Clap</span>
                </button>

                <button
                    type="button"
                    class="drum-pad"
                    data-sound="tom"
                    data-key="j"
                >
                    <kbd>J</kbd>
                    <span>Tom</span>
                </button>

                <button
                    type="button"
                    class="drum-pad"
                    data-sound="crash"
                    data-key="k"
                >
                    <kbd>K</kbd>
                    <span>Crash</span>
                </button>

                <button
                    type="button"
                    class="drum-pad"
                    data-sound="ride"
                    data-key="l"
                >
                    <kbd>L</kbd>
                    <span>Ride</span>
                </button>

            </div>
        </section>
    </main>
</body>
</html>
