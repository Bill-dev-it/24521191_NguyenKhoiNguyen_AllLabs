<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101722">
    <title>Aircraft Parts Availability | Exercise 3</title>
    <link rel="stylesheet" href="./skeleton.css">
    <script src="./parts-demo-data.js" defer></script>
    <script src="./parts.js" defer></script>
</head>
<body>
    <header class="page-header">
        <p class="eyebrow">Exercise 3 / Resilient components</p>
        <h1>Aircraft Parts Availability</h1>
        <p class="page-intro">Supplier listings for aviation maintenance teams.</p>
    </header>

    <main id="main-content">
        <section class="availability" aria-labelledby="availability-title" aria-busy="true" data-state="loading">
            <header class="availability-header">
                <section>
                    <p class="eyebrow">Parts directory</p>
                    <h2 id="availability-title">Available components</h2>
                </section>
                <p class="loading-status" role="status">Loading aircraft parts...</p>
            </header>

            <ul class="parts-skeleton" aria-hidden="true">
                <li class="skeleton-card">
                    <span class="skeleton-item skeleton-badge"></span>
                    <span class="skeleton-item skeleton-title"></span>
                    <span class="skeleton-item skeleton-line"></span>
                    <span class="skeleton-item skeleton-line skeleton-line-short"></span>
                </li>
                <li class="skeleton-card">
                    <span class="skeleton-item skeleton-badge"></span>
                    <span class="skeleton-item skeleton-title"></span>
                    <span class="skeleton-item skeleton-line"></span>
                    <span class="skeleton-item skeleton-line skeleton-line-short"></span>
                </li>
                <li class="skeleton-card">
                    <span class="skeleton-item skeleton-badge"></span>
                    <span class="skeleton-item skeleton-title"></span>
                    <span class="skeleton-item skeleton-line"></span>
                    <span class="skeleton-item skeleton-line skeleton-line-short"></span>
                </li>
            </ul>

            <section id="live-data" class="live-data" aria-labelledby="results-title" hidden>
                <header class="results-header">
                    <h3 id="results-title">Demonstration inventory</h3>
                    <p class="demo-notice">Sample records for the homework demo; not live supplier inventory.</p>
                </header>
                <ul id="metadata-badges" class="metadata-badges" aria-label="Inventory summary"></ul>
                <ul id="parts-list" class="parts-grid" aria-label="Demonstration aircraft parts"></ul>
            </section>
        </section>
    </main>
</body>
</html>
